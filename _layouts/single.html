---
layout: default
---
<article class="shell document-shell">
  <header class="page-heading">
    {% if page.kicker %}<p class="eyebrow">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.last_updated %}<p class="page-date">Updated {{ page.last_updated }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
